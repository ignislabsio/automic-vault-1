name: Phone intake prototype
on:
  pull_request:
    paths: ['extensions/phone-intake/**', '.github/workflows/phone-intake.yml']
  push:
    paths: ['extensions/phone-intake/**', '.github/workflows/phone-intake.yml']
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        working-directory: extensions/phone-intake
      - run: bun test
        working-directory: extensions/phone-intake
      - run: bun run typecheck
        working-directory: extensions/phone-intake
      - run: bun build src/phone.ts --target browser --outfile "$RUNNER_TEMP/phone.js"
        working-directory: extensions/phone-intake
